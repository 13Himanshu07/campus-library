services:
  - type: web
    name: campus-library-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://campus-library-api.onrender.com/api
  - type: web
    name: campus-library-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://campus-library-web.onrender.com
      - key: BOOTSTRAP_LIBRARIAN_EMAIL
        sync: false
      - key: BOOTSTRAP_LIBRARIAN_PASSWORD
        sync: false
      - key: DDL_AUTO
        value: update
