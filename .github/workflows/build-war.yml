name: Build Java web application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test WAR
        run: mvn --batch-mode clean package
      - name: Save WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-library-war
          path: target/campus-library.war
