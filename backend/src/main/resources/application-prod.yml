app:
  jwt-secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
management:
  health:
    mail:
      enabled: false
