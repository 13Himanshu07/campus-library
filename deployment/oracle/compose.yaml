services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--require-secure-transport=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deployment/oracle/.env}
      MYSQL_DATABASE: library_management
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deployment/oracle/.env}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in deployment/oracle/.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_tls:/run/mysql-tls
      - ../../database/docker-bootstrap.sh:/docker-entrypoint-initdb.d/01-library-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      PUBLIC_HTTPS_HOST: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in deployment/oracle/.env}
      TRUST_PROXY_TLS: "true"
      MYSQL_TLS_CA_FILE: /run/mysql-tls/ca.pem
      DB_URL: jdbc:mysql://database:3306/library_management?serverTimezone=UTC&sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/tmp/campus-library-mysql-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit
      DB_USERNAME: library_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deployment/oracle/.env}
      DB_MIGRATION_USERNAME: library_migrator
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in deployment/oracle/.env}
      LIBRARY_BORROW_DAYS: ${LIBRARY_BORROW_DAYS:-14}
      LIBRARY_BORROW_LIMIT: ${LIBRARY_BORROW_LIMIT:-5}
      LIBRARY_FINE_PER_DAY: ${LIBRARY_FINE_PER_DAY:-5.00}
    volumes:
      - mysql_tls:/run/mysql-tls:ro
    expose:
      - "8080"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in deployment/oracle/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  mysql_tls:
  caddy_data:
  caddy_config:
